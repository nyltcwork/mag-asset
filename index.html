<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Secure Login</title>

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Sarabun',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
        radial-gradient(circle at top left,#7c3aed55,transparent 35%),
        radial-gradient(circle at bottom right,#06b6d455,transparent 35%),
        linear-gradient(135deg,#0f172a,#111827,#1e1b4b);
}

/* Background Glow */

body::before,
body::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(100px);
    z-index:-1;
}

body::before{
    background:#7c3aed;
    top:-120px;
    left:-120px;
    opacity:.35;
}

body::after{
    background:#06b6d4;
    bottom:-120px;
    right:-120px;
    opacity:.35;
}

/* Login Box */

.login-box{
    width:410px;
    padding:42px 35px;
    border-radius:30px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.08);

    color:#fff;

    animation:fadeIn .5s ease;
}

/* Animation */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Logo */

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo .icon{
    width:80px;
    height:80px;
    margin:auto;
    margin-bottom:18px;

    border-radius:24px;

    background:linear-gradient(135deg,#8b5cf6,#06b6d4);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:34px;
    font-weight:bold;

    box-shadow:
        0 10px 30px rgba(139,92,246,.35);
}

.logo h1{
    font-size:34px;
    font-weight:700;
    letter-spacing:1px;
}

.logo p{
    margin-top:8px;
    color:#cbd5e1;
    font-size:14px;
}

/* Form */

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;

    color:#e2e8f0;
    font-size:14px;
    font-weight:500;
}

select,
input{
    width:100%;
    padding:15px 16px;

    border-radius:16px;
    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.10);

    color:#fff;
    font-size:15px;

    outline:none;

    transition:.25s;
}

select option{
    color:#000;
}

input::placeholder{
    color:#cbd5e1;
}

select:focus,
input:focus{
    border-color:#8b5cf6;

    background:rgba(255,255,255,.14);

    box-shadow:
        0 0 0 4px rgba(139,92,246,.18);
}

/* Button */

button{
    width:100%;
    padding:15px;

    border:none;
    border-radius:16px;

    background:linear-gradient(135deg,#8b5cf6,#06b6d4);

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;

    margin-top:8px;

    box-shadow:
        0 8px 20px rgba(139,92,246,.35);
}

button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 25px rgba(6,182,212,.40);
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:#475569;
    cursor:not-allowed;
    box-shadow:none;
}

/* Message */

.message{
    margin-top:18px;
    text-align:center;
    font-size:14px;
    min-height:22px;
    font-weight:500;
}

.loading{
    color:#facc15;
}

.success{
    color:#4ade80;
}

.error{
    color:#f87171;
}

/* Footer */

.footer{
    margin-top:22px;
    text-align:center;

    color:#94a3b8;
    font-size:12px;
    letter-spacing:.5px;
}

/* Mobile */

@media(max-width:480px){

    .login-box{
        width:92%;
        padding:35px 25px;
    }

    .logo h1{
        font-size:28px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        <div class="icon">M</div>

        <h1>LOGIN</h1>

        <p>Welcome to MAG</p>
    </div>

    <div class="form-group">
        <label>Username</label>

        <select id="username">
            <option value="">Loading users...</option>
        </select>
    </div>

    <div class="form-group">
        <label>Password</label>

        <input 
            type="password" 
            id="password" 
            placeholder="Enter your password"
        >
    </div>

    <button id="loginBtn" onclick="login()">
        Sign In
    </button>

    <div class="message" id="message"></div>

    <div class="footer">
        © Copyrights 2026 Ny LARTHONGCHANH
    </div>

</div>

<script>

// API URL

const API_URL = "https://script.google.com/macros/s/AKfycbwAAwHhHERdm1vIkcdE5JZw_9E7pRnO_5KDOB_lt7IEGiae1Khci0gLs3qLViH0vT0cnA/exec";

const APP_TOKEN = "MY_ASSET_TOKEN_2026";

// Load Users

async function loadUsers(){

    const select = document.getElementById("username");

    const message = document.getElementById("message");

    try{

        const response = await fetch(API_URL + "?action=getUsers");

        const data = await response.json();

        select.innerHTML = `
            <option value="">
                -- Select Username --
            </option>
        `;

        data.forEach(user => {

            const option = document.createElement("option");

            option.value = user.username;

            option.textContent = user.username;

            select.appendChild(option);

        });

    }catch(error){

        message.className = "message error";

        message.innerHTML = "Failed to load user data";

    }

}

// Login

async function login(){

    const username = document.getElementById("username").value;

    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    const btn = document.getElementById("loginBtn");

    if(!username || !password){

        message.className = "message error";

        message.innerHTML = "Please enter all information";

        return;

    }

    btn.disabled = true;

    message.className = "message loading";

    message.innerHTML = "Checking account...";

    try{

        const response = await fetch(API_URL,{

            method:"POST",

            body:JSON.stringify({

                action:"login",

                username:username,

                password:password,

                token:APP_TOKEN

            })

        });

        const result = await response.json();

        if(result.status == "success"){

            sessionStorage.setItem("isLoggedIn","true");

            sessionStorage.setItem("currentUser",username);

            message.className = "message success";

            message.innerHTML = "✅ Login successful";

            setTimeout(()=>{

                window.location.href = "home.html";

            },1000);

        }else{

            message.className = "message error";

            message.innerHTML = "Incorrect username or password";

            btn.disabled = false;

        }

    }catch(error){

        message.className = "message error";

        message.innerHTML = "Cannot connect to server";

        btn.disabled = false;

    }

}

// Enter Key Login

document
.getElementById("password")
.addEventListener("keypress",function(e){

    if(e.key === "Enter"){

        login();

    }

});

// Load Data

loadUsers();

</script>

</body>
</html>
